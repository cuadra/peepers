# peepers — Hyprland window rules
# peepers reports app_id / class "peepers". Source this from hyprland.conf:
#   source = ~/.config/hypr/peepers.conf
#
# Uses the `windowrule = <rule>, <match>` syntax (Hyprland 0.48+).
# On older Hyprland, replace `windowrule` with `windowrulev2`.

# The image is the interface: no border, shadow, rounding or dim.
windowrule = noborder, class:^(peepers)$
windowrule = noshadow, class:^(peepers)$
windowrule = rounding 0, class:^(peepers)$
windowrule = nodim, class:^(peepers)$
windowrule = noblur, class:^(peepers)$

# Opened from Yazi, keep focus in the terminal so you can keep browsing
# while the image shows in the adjacent tile. Remove if you prefer focus.
# windowrule = nofocus, class:^(peepers)$

# Prefer floating? Uncomment for a centred float instead of a tile.
# windowrule = float, class:^(peepers)$
# windowrule = size 70% 80%, class:^(peepers)$
# windowrule = center, class:^(peepers)$

# Optional: a key to toggle peepers between tiled and floating.
# bind = SUPER, V, togglefloating, class:^(peepers)$
