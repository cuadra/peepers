[package]
name = "peepers"
version = "0.1.0"
edition = "2021"
description = "A hyper-minimal, vim-motion image viewer for Wayland"
license = "MIT"
repository = "https://github.com/cuadra/peepers"
readme = "README.md"
rust-version = "1.85"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "image", "advanced", "canvas", "wayland", "x11", "thread-pool"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "pnm", "qoi", "tga", "hdr", "exr", "rayon"] }
fast_image_resize = { version = "6", features = ["image"] }
kamadak-exif = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
